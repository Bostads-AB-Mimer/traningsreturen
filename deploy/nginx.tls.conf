# HTTPS variant of nginx.conf for the Portainer deployments (pubdoc1).
# Cert + key come from the certs volume mounted at /etc/nginx/certs; keep the
# locations in sync with nginx.conf. ${PUBLIC_URL} is filled in from the
# container environment at startup (nginx template).

# Plain HTTP only redirects to the public HTTPS address.
server {
  listen 80;
  server_name _;
  return 301 ${PUBLIC_URL}$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # Self-hosted fonts and static assets get long cache lifetimes.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # API is proxied to the backend service.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /swagger {
    proxy_pass http://backend:4000;
  }

  location / {
    try_files $uri /index.html;
  }
}

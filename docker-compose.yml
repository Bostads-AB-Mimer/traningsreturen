services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MSSQL_PID: Express
    ports:
      - '1433:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - '8080:8080'
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: '4000'
      AUTH_MODE: ${AUTH_MODE:-oidc}
      # Issuer must match what browsers see in the token (public Keycloak URL);
      # JWKS is fetched over the internal compose network.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/traningsreturen}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/traningsreturen/protocol/openid-connect/certs}
      DB_HOST: mssql
      DB_PORT: '1433'
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-traningsreturen}
      FEATURE_EXPIRY: ${FEATURE_EXPIRY:-false}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
    depends_on:
      mssql:
        condition: service_healthy
    ports:
      - '4000:4000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${PUBLIC_KEYCLOAK_URL:-http://localhost:8080}
        VITE_KEYCLOAK_REALM: traningsreturen
        VITE_KEYCLOAK_CLIENT_ID: traningsreturen-app
    depends_on:
      - backend
    ports:
      - '8081:80'

volumes:
  mssql-data:

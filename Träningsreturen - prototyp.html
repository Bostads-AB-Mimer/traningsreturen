document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

size:14px;\">{{ openTotalStr }}<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:#7C6B77;font-size:13.5px;background:#FDF7FA;border-radius:12px;padding:10px 14px;\">Detta är exakt samma kontoutdrag som medarbetaren ser – använd det för att reda ut frågor om saldot.<\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start;\">\n          <div style=\"background:#ffffff;border:1px solid #F2E3EC;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:13px;\">\n            <div style=\"font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#A18F9B;\">Lägg till korrigering<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;\">\n              <input type=\"number\" placeholder=\"Minuter, t.ex. −45 eller 30\" value=\"{{ fixMin }}\" onchange=\"{{ onFixMin }}\" style=\"width:200px;padding:11px 14px;border:1.5px solid #EBDCE5;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;background:#ffffff;\">\n            <\u002Fdiv>\n            <input type=\"text\" placeholder=\"Orsak (obligatorisk, syns för medarbetaren)\" value=\"{{ fixReason }}\" onchange=\"{{ onFixReason }}\" style=\"width:100%;padding:11px 14px;border:1.5px solid #EBDCE5;border-radius:12px;font-family:inherit;font-size:14px;font-weight:500;background:#ffffff;\">\n            <button onclick=\"{{ applyFix }}\" style=\"border:none;cursor:pointer;background:#7A2E9D;color:#ffffff;font-family:inherit;font-weight:800;font-size:14.5px;padding:12px 18px;border-radius:13px;\" style-hover=\"background:#682684;\">Spara korrigering<\u002Fbutton>\n            <div style=\"font-size:12.5px;color:#9A8694;line-height:1.45;\">Korrigeringen loggas synligt i medarbetarens saldohistorik med ditt namn, datum och orsak.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#ffffff;border:1px solid #F2E3EC;border-radius:20px;padding:22px;\">\n            <div style=\"font-size:12px;font-weight:800;letter-spacing:0.09em;text-transform:uppercase;color:#A18F9B;margin-bottom:8px;\">Senaste träningspass<\u002Fdiv>\n            <sc-for list=\"{{ openWorkouts }}\" as=\"w\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F8EEF4;\">\n                <div style=\"{{ w.dotStyle }}\"><\u002Fdiv>\n                <div style=\"flex:1;min-width:0;\">\n                  <div style=\"font-weight:700;font-size:13.5px;\">{{ w.name }}<\u002Fdiv>\n                  <div style=\"font-size:12px;color:#9A8694;\">{{ w.dateStr }} · {{ w.minStr }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button onclick=\"{{ w.onFix }}\" style=\"border:none;cursor:pointer;background:none;color:#7A2E9D;font-family:inherit;font-weight:700;font-size:12.5px;padding:5px 8px;border-radius:8px;\" style-hover=\"background:#F0E6FA;\">Rätta<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#ffffff;border:1px solid #F2E3EC;border-radius:20px;padding:6px 18px;overflow-x:auto;\">\n          <div style=\"min-width:760px;\">\n            <div style=\"display:grid;grid-template-columns:104px minmax(250px,1fr) 104px 128px 96px;gap:12px;padding:13px 4px;font-size:11.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#A18F9B;\">\n              <div>Datum<\u002Fdiv>\n              <div>Händelse<\u002Fdiv>\n              <div style=\"text-align:right;\">Tid<\u002Fdiv>\n              <div>Förfaller<\u002Fdiv>\n              <div style=\"text-align:right;\">Saldo<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ openRows }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <div style=\"display:grid;grid-template-columns:104px minmax(250px,1fr) 104px 128px 96px;gap:12px;align-items:center;padding:11px 4px;border-top:1px solid #F8EEF4;\">\n                <div style=\"font-size:13px;color:#7C6B77;font-weight:600;\">{{ r.dateStr }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:9px;min-width:0;\">\n                  <span style=\"{{ r.chipStyle }}\">{{ r.chipLabel }}<\u002Fspan>\n                  <div style=\"min-width:0;\">\n                    <div style=\"font-size:13.5px;font-weight:600;color:#3A2D36;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ r.label }}<\u002Fdiv>\n                    <sc-if value=\"{{ r.hasSub }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"font-size:12px;color:#A18F9B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ r.sub }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"{{ r.amtStyle }}\">{{ r.amountStr }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#A18F9B;font-weight:600;\">{{ r.expStr }}<\u002Fdiv>\n                <div style=\"font-size:13.5px;font-weight:800;text-align:right;color:#3A2D36;\">{{ r.balStr }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ===================== ADMIN: AKTIVITETSTYPER ===================== -->\n    <sc-if value=\"{{ vAkt }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Admin – Aktivitetstyper\" style=\"max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;animation:fadeUp .35s ease;\">\n        <div>\n          <h1 style=\"margin:0 0 4px;font-size:26px;font-weight:800;letter-spacing:-0.02em;\">Aktivitetstyper<\u002Fh1>\n          <div style=\"color:#7C6B77;font-size:14px;\">Aktiviteterna som visas i rullistan när medarbetare registrerar träning.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #F2E3EC;border-radius:20px;padding:20px;display:flex;gap:10px;\">\n          <input type=\"text\" placeholder=\"Ny aktivitet, t.ex. Skidåkning\" value=\"{{ newAct }}\" onchange=\"{{ onNewAct }}\" style=\"flex:1;padding:11px 14px;border:1.5px solid #EBDCE5;border-radius:12px;font-family:inherit;font-size:14px;font-weight:600;background:#ffffff;\">\n          <button onclick=\"{{ addAct }}\" style=\"border:none;cursor:pointer;background:#E0007A;color:#ffffff;font-family:inherit;font-weight:800;font-size:14px;padding:11px 18px;border-radius:12px;white-space:nowrap;\" style-hover=\"background:#C4006C;\">Lägg till<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#ffffff;border:1px solid #F2E3EC;border-radius:20px;padding:8px 20px;\">\n          <sc-for list=\"{{ actRows }}\" as=\"a\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #F8EEF4;flex-wrap:wrap;\">\n              <div style=\"{{ a.dotStyle }}\"><\u002Fdiv>\n              <sc-if value=\"{{ a.notRenaming }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"flex:1;min-width:120px;font-weight:700;font-size:14.5px;\">{{ a.name }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.isRenaming }}\" hint-placeholder-val=\"{{ false }}\">\n                <input type=\"text\" value=\"{{ renameVal }}\" onchange=\"{{ onRenameVal }}\" style=\"flex:1;min-width:120px;padding:8px 12px;border:1.5px solid #EBDCE5;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;background:#ffffff;\">\n              <\u002Fsc-if>\n              <span style=\"{{ a.chipStyle }}\">{{ a.chipLabel }}<\u002Fspan>\n              <sc-if value=\"{{ a.notRenaming }}\" hint-placeholder-val=\"{{ true }}\">\n                <button onclick=\"{{ a.onRename }}\" style=\"border:none;cursor:pointer;background:none;color:#C4006C;font-family:inherit;font-weight:700;font-size:12.5px;padding:6px 8px;border-radius:8px;\" style-hover=\"background:#FBDFEE;\">Byt namn<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ a.isRenaming }}\" hint-placeholder-val=\"{{ false }}\">\n                <button onclick=\"{{ saveRename }}\" style=\"border:none;cursor:pointer;background:#E0007A;color:#ffffff;font-family:inherit;font-weight:700;font-size:12.5px;padding:7px 13px;border-radius:9px;\" style-hover=\"background:#C4006C;\">Spara<\u002Fbutton>\n              <\u002Fsc-if>\n              <button onclick=\"{{ a.onToggle }}\" style=\"border:none;cursor:pointer;background:none;color:#9A8694;font-family:inherit;font-weight:700;font-size:12.5px;padding:6px 8px;border-radius:8px;\" style-hover=\"background:#F6ECF2;\">{{ a.toggleLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <footer style=\"text-align:center;padding:0 20px 36px;color:#C1AEBB;font-size:12.5px;font-weight:600;\">Klickbar prototyp med mockdata · Träningsreturen för Bostads AB Mimer<\u002Ffooter>\n\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#241A21;color:#ffffff;padding:13px 22px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(36,26,33,0.3);z-index:100;animation:toastIn .25s ease;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;visaForfallKoncept&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;section&quot;: &quot;Koncept: rullande förfall&quot;, &quot;tsType&quot;: &quot;boolean&quot; },\n  &quot;veckotakMin&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 36, &quot;min&quot;: 12, &quot;max&quot;: 120, &quot;step&quot;: 6, &quot;unit&quot;: &quot;min&quot;, &quot;section&quot;: &quot;Affärsregler&quot;, &quot;tsType&quot;: &quot;number&quot; },\n  &quot;returandel&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 20, &quot;min&quot;: 10, &quot;max&quot;: 50, &quot;step&quot;: 5, &quot;unit&quot;: &quot;%&quot;, &quot;section&quot;: &quot;Affärsregler&quot;, &quot;tsType&quot;: &quot;number&quot; }\n}\">\nclass Component extends DCLogic {\n  MONS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];\n  MONF = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];\n  DAYS = ['sön','mån','tis','ons','tor','fre','lör'];\n  DAYF = ['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];\n  ACTCOL = {'Gym':'#E0007A','Jogging':'#2D5FE0','Power walk':'#00A5A0','Cykling':'#7A2E9D','Simning':'#0E86C7','Padel':'#E07C00','Gruppträning':'#C13FA8','Skidåkning':'#5E6AD2'};\n\n  state = this.buildInit();\n\n  // ---------- utils ----------\n  rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ t >>> 15, 1 | t); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }\n  today() { const d = new Date(); d.setHours(0,0,0,0); return d; }\n  ymd(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }\n  pd(s) { const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }\n  mondayOf(d) { const x = new Date(d); const k = (x.getDay()+6)%7; x.setDate(x.getDate()-k); x.setHours(0,0,0,0); return x; }\n  addM(d, n) { const x = new Date(d); x.setMonth(x.getMonth()+n); return x; }\n  fmtD(s) { const d = this.pd(s); return d.getDate() + ' ' + this.MONS[d.getMonth()] + ' ' + d.getFullYear(); }\n  fmtDs(s) { const d = this.pd(s); return this.DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + this.MONS[d.getMonth()]; }\n  fmtMin(m) { const a = Math.abs(Math.round(m)); const h = Math.floor(a/60), mm = a % 60; if (h > 0 && mm > 0) return h + ' h ' + mm + ' min'; if (h > 0) return h + ' h'; return mm + ' min'; }\n  signMin(m) { return (m >= 0 ? '+' : '−') + this.fmtMin(m); }\n  fmtHrs(h) { return String(h).replace('.', ',') + ' h'; }\n  actColor(n) { return this.ACTCOL[n] || '#9A8694'; }\n  initials(name) { return name.split(' ').map(p => p[0]).join('').slice(0,2).toUpperCase(); }\n\n  // ---------- style builders ----------\n  seg(on) { return { border:'none', cursor:'pointer', fontFamily:'inherit', padding:'8px 15px', borderRadius:'999px', fontWeight:700, fontSize:'13px', background: on ? '#ffffff' : 'transparent', color: on ? '#C4006C' : '#8A7484', boxShadow: on ? '0 1px 5px rgba(42,30,40,0.14)' : 'none', transition:'all .15s' }; }\n  tabS(on) { return { border:'none', cursor:'pointer', fontFamily:'inherit', padding:'9px 15px', borderRadius:'12px', fontWeight:700, fontSize:'13.5px', background: on ? '#FBDFEE' : 'transparent', color: on ? '#B4005F' : '#7C6B77', transition:'all .15s' }; }\n  chip(bg, col) { return { display:'inline-flex', alignItems:'center', padding:'3px 10px', borderRadius:'999px', fontSize:'11.5px', fontWeight:700, background:bg, color:col, whiteSpace:'nowrap' }; }\n  dot(c) { return { width:'10px', height:'10px', borderRadius:'50%', background:c, flexShrink:0 }; }\n  mChip(on) { return { border: on ? '1.5px solid #E0007A' : '1.5px solid #EBDCE5', cursor:'pointer', fontFamily:'inherit', padding:'8px 14px', borderRadius:'999px', fontWeight:700, fontSize:'13.5px', background: on ? '#FBDFEE' : '#ffffff', color: on ? '#B4005F' : '#5C4B57' }; }\n  stCh(s) { const m = { vantar:['Väntar på attest','#FFF3DC','#96690A'], godkand:['Godkänd','#E0F5EC','#0B7B5D'], avslagen:['Avslagen','#FCE5E8','#C22F45'] }; const x = m[s]; return { label:x[0], style:this.chip(x[1], x[2]) }; }\n  typCh(t) { const m = { in:['Intjänad','#E0F5EC','#0B7B5D'], ut:['Uttag','#FBDFEE','#B4005F'], korr:['Korrigering','#F0E6FA','#7A2E9D'], forfall:['Förfall','#FFEBD6','#A05A00'] }; const x = m[t]; return { label:x[0], style:this.chip(x[1], x[2]) }; }\n\n  // ---------- mock data ----------\n  buildInit() {\n    const users = [\n      { id:'u1', name:'Sara Lindqvist', dept:'Fastighetsservice', title:'Fastighetsskötare', seed:11, active:true },\n      { id:'u2', name:'Johan Pettersson', dept:'Fastighetsservice', title:'Drifttekniker', seed:22, active:true },\n      { id:'u3', name:'Ali Hassan', dept:'Fastighetsservice', title:'Fastighetsskötare', seed:33, active:true },\n      { id:'u4', name:'Karin Öberg', dept:'Kundcenter', title:'Kundvärd', seed:44, active:true },\n      { id:'u5', name:'Erik Sandström', dept:'Fastighetsservice', title:'Snickare', seed:55, active:true },\n      { id:'u6', name:'Erik Sandstrom', dept:'Fastighetsservice', title:'Snickare', seed:56, active:true },\n      { id:'u7', name:'Lena Ahmadi', dept:'Ekonomi', title:'Redovisningsekonom', seed:77, active:true },\n      { id:'u8', name:'Marcus Nyström', dept:'Projekt', title:'Projektledare', seed:88, active:false }\n    ];\n    const workoutsByUser = {};\n    users.forEach(u => { workoutsByUser[u.id] = this.genWorkouts(u); });\n    const leaves = [\n      { id:'l1', userId:'u1', date:'2025-10-03', start:'13:00', hours:2,   status:'godkand',  attestedBy:'Anna Berg', applied:'2025-09-29' },\n      { id:'l2', userId:'u1', date:'2026-02-13', start:'12:00', hours:1.5, status:'godkand',  attestedBy:'Anna Berg', applied:'2026-02-09' },\n      { id:'l3', userId:'u1', date:'2026-03-06', start:'08:00', hours:4,   status:'avslagen', attestedBy:'Anna Berg', comment:'Krockar med OVK-besiktningen i Skallberget – kan du ta veckan efter?', applied:'2026-03-02' },\n      { id:'l4', userId:'u1', date:'2026-04-10', start:'14:00', hours:2,   status:'godkand',  attestedBy:'Anna Berg', applied:'2026-04-07' },\n      { id:'l5', userId:'u1', date:'2026-07-10', start:'13:00', hours:2,   status:'vantar',   applied:'2026-06-30' },\n      { id:'l6', userId:'u3', date:'2

# Portainer deployment on pubdoc1: HTTPS on :8443, login via Mimer's shared
# Keycloak (auth.dev.mimer.nu, realm onecore).
#
# Before the first deploy, create the Docker volume traningsreturen-certs and
# put the TLS cert chain (fullchain.pem) and unencrypted key (privkey.pem) in
# it. The cert never lives in Git.
#
# Portainer stack environment variables:
#   DB_PASSWORD  (required) SQL Server sa password, min 8 chars incl. upper/lower/digit
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    pull_policy: build
    restart: unless-stopped
    environment:
      PORT: '4000'
      AUTH_MODE: oidc
      OIDC_ISSUER: https://auth.dev.mimer.nu/realms/onecore
      OIDC_JWKS_URI: https://auth.dev.mimer.nu/realms/onecore/protocol/openid-connect/certs
      OIDC_CLIENT_ID: traningsreturen-app
      AUTO_PROVISION_USERS: 'true'
      DB_HOST: mssql
      DB_PORT: '1433'
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: traningsreturen
      FEATURE_EXPIRY: 'false'
      SEED_DEMO_DATA: 'false'
      CORS_ORIGIN: https://pubdoc1.mimer.nu:8443
    depends_on:
      mssql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NGINX_CONF: deploy/nginx.tls.conf
        VITE_KEYCLOAK_URL: https://auth.dev.mimer.nu
        VITE_KEYCLOAK_REALM: onecore
        VITE_KEYCLOAK_CLIENT_ID: traningsreturen-app
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - traningsreturen-certs:/etc/nginx/certs:ro
    ports:
      # 8443 must match the redirect in deploy/nginx.tls.conf.
      - '8443:443'
      - '8081:80'

volumes:
  mssql-data:
  traningsreturen-certs:
    external: true
